<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>SharedWorker 通信示例</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                font-family: system-ui, sans-serif;
                max-width: 720px;
                margin: 24px auto;
                padding: 0 16px;
                line-height: 1.5;
            }
            h1 {
                font-size: 1.25rem;
                margin-bottom: 8px;
            }
            .hint {
                color: #666;
                font-size: 14px;
                margin-bottom: 16px;
            }
            section {
                border: 1px solid #ddd;
                border-radius: 8px;
                padding: 12px 16px;
                margin-bottom: 12px;
            }
            section h2 {
                font-size: 15px;
                margin: 0 0 10px;
            }
            button {
                margin: 4px 6px 4px 0;
                padding: 6px 12px;
                cursor: pointer;
            }
            input[type='text'],
            input[type='number'] {
                padding: 4px 8px;
                width: 120px;
            }
            #log {
                background: #111;
                color: #0f0;
                font:
                    12px/1.4 ui-monospace,
                    monospace;
                padding: 10px;
                border-radius: 6px;
                max-height: 280px;
                overflow: auto;
                white-space: pre-wrap;
            }
            .status {
                font-size: 13px;
                color: #333;
                margin-top: 8px;
            }
            .progress {
                height: 6px;
                background: #eee;
                border-radius: 3px;
                margin-top: 6px;
                overflow: hidden;
            }
            .progress > span {
                display: block;
                height: 100%;
                width: 0;
                background: #2563eb;
                transition: width 0.15s;
            }
        </style>
    </head>
    <body>
        <h1>SharedWorker 复杂任务示例</h1>
        <p class="hint">
            用
            <code>npx serve . -p 8080</code>
            启动后访问本页。再开第二个 tab 可看到多 tab 共享同一 worker。
        </p>
        <button id="block">故意阻塞主线程 5 秒</button>

        <section>
            <h2>连接与心跳</h2>
            <label>
                Tab 名称
                <input id="tabLabel" type="text" placeholder="Tab A" />
            </label>
            <button id="btnPing">Ping Worker</button>
            <button id="btnState">拉取全局状态</button>
            <p class="status" id="connStatus">未连接</p>
        </section>

        <section>
            <h2>复杂任务（主线程不阻塞）</h2>
            <button id="btnFib">斐波那契</button>
            <button id="btnBatch">批量转换 200 条记录</button>
            <button id="btnJson">解析大 JSON (50000 行)</button>
            <button id="btnCancel" disabled>取消当前任务</button>
            <div class="progress"><span id="progressBar"></span></div>
            <p class="status" id="taskStatus">空闲</p>
        </section>

        <section>
            <h2>事件日志</h2>
            <div id="log"></div>
        </section>

        <script>
            const worker = new SharedWorker('/worker.js');
            const port = worker.port;

            let clientId = '';
            let currentTaskId = null;

            const $ = (id) => document.getElementById(id);
            const logEl = $('log');
            const progressBar = $('progressBar');
            const taskStatus = $('taskStatus');
            const connStatus = $('connStatus');
            const btnCancel = $('btnCancel');

            function log(msg, data) {
                const line =
                    data !== undefined
                        ? `[${new Date().toLocaleTimeString()}] ${msg} ${JSON.stringify(data)}`
                        : `[${new Date().toLocaleTimeString()}] ${msg}`;
                logEl.textContent = `${line}\n${logEl.textContent}`.slice(0, 8000);
            }

            function send(message) {
                port.postMessage(message);
            }

            function nextTaskId(prefix) {
                currentTaskId = `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`;
                btnCancel.disabled = false;
                return currentTaskId;
            }

            port.start();

            function onTaskSettled(task) {
                btnCancel.disabled = true;
                currentTaskId = null;
            }

            port.onmessage = (event) => {
                const msg = event.data;
                switch (msg.type) {
                    case 'connected':
                        clientId = msg.clientId;
                        connStatus.textContent = `已连接 ${clientId}，当前 ${msg.clientCount} 个 tab 在线`;
                        log('worker connected', msg);
                        send({
                            type: 'setLabel',
                            payload: { label: $('tabLabel').value || clientId },
                        });
                        break;

                    case 'pong':
                        log('pong', { latencyMs: Date.now() - msg.at });
                        break;

                    case 'clients':
                        log('在线 tab 更新', msg.clients);
                        break;

                    case 'state':
                        log('全局状态', msg);
                        break;

                    case 'taskStarted':
                        log('任务开始', { taskId: msg.taskId, name: msg.task.name });
                        taskStatus.textContent = `执行中: ${msg.task.name} (${msg.task.requestedBy})`;
                        progressBar.style.width = '0%';
                        break;

                    case 'taskProgress': {
                        const task = msg.task;
                        progressBar.style.width = `${task.progress}%`;
                        if (task.status === 'done') {
                            taskStatus.textContent = `完成: ${task.name}`;
                            log('任务完成', { taskId: msg.taskId, result: task.result });
                            onTaskSettled(task);
                        } else if (task.status === 'error') {
                            taskStatus.textContent = `失败: ${task.error}`;
                            log('任务失败', task);
                            onTaskSettled(task);
                        } else {
                            taskStatus.textContent = `${task.name} ${task.progress}%`;
                            if (task.partial) {
                                log('进度', { taskId: msg.taskId, ...task.partial });
                            }
                        }
                        break;
                    }

                    case 'taskRejected':
                        log('任务被拒绝', msg);
                        onTaskSettled();
                        break;

                    case 'error':
                        log('worker error', msg.error);
                        break;
                }
            };

            $('tabLabel').addEventListener('change', () => {
                send({ type: 'setLabel', payload: { label: $('tabLabel').value } });
            });

            $('btnPing').addEventListener('click', () => send({ type: 'ping' }));

            $('btnState').addEventListener('click', () => send({ type: 'getState' }));

            $('btnFib').addEventListener('click', () => {
                send({
                    type: 'runTask',
                    taskId: nextTaskId('fib'),
                    payload: { name: 'fibonacci', input: { n: 1000 } },
                });
            });

            $('btnBatch').addEventListener('click', () => {
                const items = Array.from({ length: 200 }, (_, i) => ({
                    id: i + 1,
                    name: `  Product ${i + 1}  `,
                    score: Math.random() * 100,
                    tags: i % 3 === 0 ? ['hot', '', 'sale'] : ['normal'],
                }));
                send({
                    type: 'runTask',
                    taskId: nextTaskId('batch'),
                    payload: { name: 'batchTransform', input: { items } },
                });
            });

            $('btnJson').addEventListener('click', () => {
                send({
                    type: 'runTask',
                    taskId: nextTaskId('json'),
                    payload: { name: 'parseLargeJson', input: { size: 50000 } },
                });
            });

            $('btnCancel').addEventListener('click', () => {
                if (currentTaskId) {
                    send({ type: 'cancelTask', taskId: currentTaskId });
                }
            });
        </script>
        <script>
            document.getElementById('block').addEventListener('click', () => {
                console.log('主线程开始阻塞 5 秒...');
                const start = Date.now();
                while (Date.now() - start < 5000) {
                    // 同步死循环，卡死事件循环
                }
                console.log('主线程恢复自由！');
            });
        </script>
    </body>
</html>
